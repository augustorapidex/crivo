<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crivo Finance — Preparar acesso</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:#090b09;color:#f4f5f1;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:710px;margin:55px auto;padding:16px;line-height:1.55}h1{font-size:30px;letter-spacing:-.055em}p{color:#9a9e97}strong{color:#c7ff64}form{background:#151915;border:1px solid #333b31;border-radius:22px;padding:26px}label{display:block;margin:20px 0 7px;font-weight:600;font-size:13px}input,textarea{width:100%;padding:14px;background:#0c0f0b;border:1px solid #404840;border-radius:10px;color:#fff;font:inherit}textarea{min-height:220px;font-size:12px}button{display:inline-block;border:0;border-radius:12px;background:#c7ff64;color:#141b10;font-weight:800;padding:14px 18px;cursor:pointer;margin-top:19px}.tip{font-size:12px;margin:12px 0;color:#b5b9b1}#result{margin-top:26px}#status{color:#c7ff64}
</style></head><body><h1>Crivo <strong>Finance</strong></h1><p>Prepare sua senha e os avisos do sistema. Este arquivo funciona no seu computador. Nada é enviado a ninguém.</p><form id="setup"><label>Sua nova senha (mínimo de 12 caracteres)</label><input id="password" type="password" minlength="12" required autocomplete="new-password"><label>Seu e-mail (usado somente na identificação dos avisos)</label><input id="email" type="email" required placeholder="voce@exemplo.com"><button type="submit">Gerar minhas configurações</button><p class="tip">Guarde a senha. As informações abaixo serão copiadas para o painel da Vercel; não as compartilhe.</p><div id="status" role="status"></div><div id="result" hidden><label>Configurações geradas — copiar tudo</label><textarea id="variables" readonly spellcheck="false"></textarea><button id="copy" type="button">Copiar configurações</button></div></form><script>
const hex=u=>Array.from(u).map(x=>x.toString(16).padStart(2,'0')).join('');
const b64=u=>btoa(String.fromCharCode(...u)).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');
const rand=n=>crypto.getRandomValues(new Uint8Array(n));
document.getElementById('setup').addEventListener('submit',async ev=>{ev.preventDefault();const btn=ev.target.querySelector('[type=submit]');btn.disabled=true;document.getElementById('status').textContent='Gerando configurações seguras...';try{
if(!globalThis.crypto?.subtle)throw Error('Abra o arquivo em um navegador atualizado.');
const password=document.getElementById('password').value;const email=document.getElementById('email').value.trim();
if(password.length<12)throw Error('Use uma senha com ao menos 12 caracteres.');
const salt=rand(16);const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),{name:'PBKDF2'},false,['deriveBits']);
const derived=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},key,256));
const keys=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
const jwk=await crypto.subtle.exportKey('jwk',keys.privateKey);
const decodeUrl=s=>Uint8Array.from(atob(s.replaceAll('-','+').replaceAll('_','/')+'='.repeat((4-s.length%4)%4)),x=>x.charCodeAt(0));
const x=decodeUrl(jwk.x),y=decodeUrl(jwk.y),d=decodeUrl(jwk.d);
const pub=new Uint8Array(65);pub[0]=4;pub.set(x,1);pub.set(y,33);
const data=[
'AUTH_PASSWORD_HASH=pbkdf2$310000$'+hex(salt)+'$'+hex(derived),
'SESSION_SECRET='+hex(rand(48)),
'CRON_SECRET='+hex(rand(32)),
'VAPID_PUBLIC_KEY='+b64(pub),
'VAPID_PRIVATE_KEY='+b64(d),
'VAPID_SUBJECT=mailto:'+email
].join('\n');
document.getElementById('variables').value=data;document.getElementById('result').hidden=false;document.getElementById('status').textContent='Tudo pronto. Copie cada nome e valor para a Vercel.';
}catch(e){document.getElementById('status').textContent=e.message;}finally{btn.disabled=false;}});
document.getElementById('copy').onclick=async()=>{const box=document.getElementById('variables');try{await navigator.clipboard.writeText(box.value);document.getElementById('status').textContent='Informações copiadas.';}catch{box.select();document.execCommand('copy');document.getElementById('status').textContent='Selecione e copie o texto acima.';}};
</script></body></html>
